name: Cloud Security Engineer Labs - CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  #Github work flow dispatch on push/pull to main branch

jobs:
  validate-terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/azure-infrastructure-security/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate
   #Terraform validation steps

  plan-terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate-terraform
    defaults:
      run:
        working-directory: labs/azure-infrastructure-security/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: terraform plan -out=tfplan
      #Terraform Plan Steps
  apply-terraform:
    name: Terraform Apply (Main Branch Only)
    runs-on: ubuntu-latest
    needs: plan-terraform
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: labs/azure-infrastructure-security/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: terraform apply -auto-approve tfplan
       #Terraform Apply Steps
  validate-kql:
    name: Validate KQL Queries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate KQL Syntax
        run: |
          echo "Validating KQL files..."
          for file in $(find labs/sentinel-detection-engineering/kql -name "*.kql"); do
            echo "Checking $file"
            if ! grep -q ";" "$file"; then
              echo "::warning file=$file::KQL query may be missing a terminating semicolon"
            fi
          done
    #KQL validation
  powershell-lint:
    name: PowerShell Script Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell
        uses: PowerShell/PowerShell-For-GitHub-Actions@v2

      - name: Lint PowerShell Scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Recurse -Filter *.ps1
          foreach ($s in $scripts) {
            Write-Host "Linting $($s.FullName)"
            pwsh -NoLogo -NoProfile -Command "Invoke-ScriptAnalyzer -Path '$($s.FullName)' -Recurse -Severity Warning"
          }
     #PowerShell Linting
